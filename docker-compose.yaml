version: '3.7'
services:
  backend:
    volumes:
      - static:/static
    env_file:
      - .env
    build:
      context: ./backend
    ports:
      - "8888:8888" # backend
      - "8000:8000" # dashboard shim
      - "5000:5000" # great lakes prod shim (5000)
      - "5001:5000" # lighthouse prod shim
      - "5002:5000" # armis2 prod shim
  frontend:
    build:
      context: ./frontend
    volumes:
      - frontend:/app/build
    ports:
      - 3000:3000
  nginx:
    build:
      context: ./nginx
    volumes:
      - static:/static
      - frontend:/var/www/frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  static:
  frontend:

networks:
  hpc-dashboard:
    external: true